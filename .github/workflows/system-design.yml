name: System Design Coach

on:
  push:
    branches:
      - main
    paths:
      - "agent-triggers/system-design.txt"
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 3"

permissions:
  contents: write

concurrency:
  group: career-hq-pages
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run agent
        run: python agents/run_agent.py --agent system-design
      - name: Commit generated report safely
        env:
          AGENT_KEY: system-design
          REPORT_FILE: reports/system-design.md
          COMMIT_MESSAGE: Update system-design report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$REPORT_FILE" /tmp/agent-report.md
          cp data/latest.json /tmp/generated-latest.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/agent-report.md "$REPORT_FILE"
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          latest_path = Path("data/latest.json")
          try:
              latest = json.loads(latest_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              latest = {}
          try:
              generated = json.loads(Path("/tmp/generated-latest.json").read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              generated = {}
          if not isinstance(latest, dict):
              latest = {}
          if not isinstance(latest.get("reports"), dict):
              latest["reports"] = {}
          generated_reports = generated.get("reports", {}) if isinstance(generated, dict) else {}
          key = os.environ["AGENT_KEY"]
          if key not in generated_reports:
              raise SystemExit(f"Generated report missing: {key}")
          latest["reports"][key] = generated_reports[key]
          latest["last_updated"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          latest_path.write_text(json.dumps(latest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
            git add "$REPORT_FILE" data/latest.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "$COMMIT_MESSAGE"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Could not push report after five attempts" >&2
          exit 1
