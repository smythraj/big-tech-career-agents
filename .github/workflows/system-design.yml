name: System Design Coach

on:
  push:
    branches:
      - main
    paths:
      - "agent-triggers/system-design.txt"
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 3"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: career-hq-pages
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: python agents/run_agent.py --agent system-design
      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update system-design report"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare dashboard bundle
        run: |
          mkdir -p site/data site/reports
          cp index.html manifest.webmanifest icon.svg sw.js site/
          cp data/latest.json site/data/latest.json
          cp reports/*.md site/reports/
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
