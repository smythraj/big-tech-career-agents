name: Publish Career HQ

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "icon.svg"
      - "sw.js"
      - "reports/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        run: |
          mkdir -p site/reports site/data
          cp index.html manifest.webmanifest icon.svg sw.js site/
          cp reports/*.md site/reports/
          cp data/latest.json site/data/latest.json
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
