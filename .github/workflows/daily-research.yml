name: Daily Career Research

on:
  push:
    branches:
      - main
    paths:
      - "agents/daily_research.py"
      - ".github/workflows/daily-research.yml"
      - "ROADMAP.md"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: career-hq-pages
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gather live research
        run: python agents/daily_research.py
      - name: Publish research report safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp reports/daily-research.md /tmp/daily-research.md
          cp data/daily-research.json /tmp/daily-research.json
          cp data/latest.json /tmp/generated-latest.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/daily-research.md reports/daily-research.md
            cp /tmp/daily-research.json data/daily-research.json
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("data/latest.json")
          try:
              latest = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              latest = {}
          generated = json.loads(Path("/tmp/generated-latest.json").read_text(encoding="utf-8"))
          if not isinstance(latest, dict):
              latest = {}
          if not isinstance(latest.get("reports"), dict):
              latest["reports"] = {}
          latest["reports"]["daily-research"] = generated["reports"]["daily-research"]
          latest["last_updated"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          path.write_text(json.dumps(latest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
            git add reports/daily-research.md data/daily-research.json data/latest.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Update daily career research"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Could not push research report after five attempts" >&2
          exit 1
